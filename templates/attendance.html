<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .card {
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.95) !important;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4) !important;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
            border-color: #198754;
        }
        .btn-success {
            background: linear-gradient(135deg, #198754 0%, #146c43 100%);
            border: none;
            transition: transform 0.2s;
        }
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(25, 135, 84, 0.4);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card shadow-lg p-4 p-sm-4 border-0 rounded-4 w-100" style="max-width: 420px;" id="main-container">
        <div class="text-center mb-3">
            <div class="mb-2 text-success fs-2">
                <i class="fa-solid fa-user-check"></i>
            </div>
            <h4 class="fw-bold text-success">Mark Your Attendance</h4>
            <p class="text-muted small">Please fill out your correct details</p>
        </div>
        <form method="POST">
            <!-- Token hidden field joda gaya hai expiry validate karne ke liye -->
            <input type="hidden" name="token" value="{{ token }}">
            
            <div class="mb-2">
                <label class="form-label small fw-semibold">Full Name</label>
                <input type="text" name="name" class="form-control py-2" placeholder="e.g. Rahul Sharma" required>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Roll Number</label>
                <input type="text" name="roll" class="form-control py-2" placeholder="e.g. 2105101" required>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Branch / Class</label>
                <input type="text" name="branch" class="form-control py-2" placeholder="e.g. CSE-A" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Subject Name</label>
                <input type="text" name="subject" class="form-control py-2" placeholder="e.g. Data Structures" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold rounded-pill shadow-sm">Submit Attendance</button>
        </form>
    </div>

    <!-- Device Limit Check Script -->
    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            let count = localStorage.getItem('device_attendance_count') || 0;
            if (parseInt(count) >= 2) {
                document.getElementById('main-container').innerHTML = `
                    <div class="text-center py-4">
                        <div class="mb-3 text-danger fs-1">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-2">Device Limit Reached</h4>
                        <p class="text-muted small px-2">Maximum attendance limit (2 submissions) has already been reached for this device.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
