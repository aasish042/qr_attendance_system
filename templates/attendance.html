<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Attendance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-lg p-4 border-0 rounded-4" style="width: 400px;">
        <div class="text-center mb-3">
            <h4 class="fw-bold text-success">Mark Your Attendance</h4>
            <p class="text-muted small">Please fill out your correct details</p>
        </div>
        <form method="POST">
            <div class="mb-2">
                <label class="form-label small fw-semibold">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Roll Number</label>
                <input type="text" name="roll" class="form-control" placeholder="e.g. 2105101" required>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Branch / Class</label>
                <input type="text" name="branch" class="form-control" placeholder="e.g. CSE-A" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Subject Name</label>
                <input type="text" name="subject" class="form-control" placeholder="e.g. Data Structures" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-pill shadow-sm">Submit Attendance</button>
        </form>
    </div>
</body>
</html>
