<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .card {
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.95) !important;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4) !important;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card shadow-lg p-4 p-sm-5 border-0 rounded-4 text-center w-100" style="max-width: 420px;">
        <div class="mb-3 text-success fs-1">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h3 class="fw-bold text-dark">Attendance Recorded!</h3>
        <p class="text-muted small mt-2">Aapki attendance safalpurvak darj ho chuki hai. Aap ab window band kar सकते hain.</p>
    </div>
</body>
</html>
